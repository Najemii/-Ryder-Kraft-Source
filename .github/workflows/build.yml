name: Build SpeedLife APK

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that contains the source ZIP (any .zip name works)"
        required: true
        default: "vv3"

permissions:
  contents: write

concurrency:
  group: build-speedlife-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Skips the slow install when build-tools already exist on the runner.
      - name: Locate Android build-tools
        shell: bash
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$BT" ]; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager --install "build-tools;35.0.0"
            BT="$ANDROID_HOME/build-tools/35.0.0"
          fi
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
          echo "Using build-tools: $BT"

      - name: Cache Apktool
        id: apktool_cache
        uses: actions/cache@v4
        with:
          path: apktool.jar
          key: apktool-2.10.0

      - name: Install Apktool
        if: steps.apktool_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -o apktool.jar
          test -s apktool.jar

      # Takes whichever .zip is attached to the release (newest one), no renaming needed.
      - name: Download source ZIP from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching release: $TAG"
          RELEASE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")

          ASSET_ID=$(echo "$RELEASE_JSON" | jq -r \
            '[.assets[] | select(.name | ascii_downcase | endswith(".zip"))]
             | sort_by(.updated_at) | reverse | .[0].id // empty')
          ASSET_NAME=$(echo "$RELEASE_JSON" | jq -r \
            '[.assets[] | select(.name | ascii_downcase | endswith(".zip"))]
             | sort_by(.updated_at) | reverse | .[0].name // empty')

          if [ -z "$ASSET_ID" ]; then
            echo "No .zip found in release $TAG"
            echo "Available assets:"
            echo "$RELEASE_JSON" | jq -r '.assets[].name'
            exit 1
          fi

          echo "Using source ZIP: $ASSET_NAME"

          curl -fL --retry 3 \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            -o source.zip

          test -s source.zip
          mkdir -p source
          unzip -q source.zip -d source
          echo "Source ZIP ready."

      - name: Locate and validate project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t FILES < <(find source -type f -name apktool.yml)

          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one apktool.yml; found ${#FILES[@]}"
            exit 1
          fi

          APKTOOL_DIR="$(dirname "${FILES[0]}")"
          echo "APKTOOL_DIR=$APKTOOL_DIR" >> "$GITHUB_ENV"

          test -f "$APKTOOL_DIR/AndroidManifest.xml"
          test -f "$APKTOOL_DIR/res/values/public.xml"

          grep -Fq 'speedlife.launcher.game' "$APKTOOL_DIR/AndroidManifest.xml"

          LISTENER=$(find "$APKTOOL_DIR" -name DirectConnectSubmitListener.smali -print -quit)
          test -n "$LISTENER"
          grep -Fq '82.39.186.143' "$LISTENER"

          if ! grep -Eq '7013|0x1b65' "$LISTENER"; then
            echo "ERROR: Server port verification failed."
            exit 1
          fi

          echo "Project validation successful."

      # Only touches SL.Chip if it exists. A project without it is fine (no failure).
      - name: Fix SL Chip Style (optional)
        shell: bash
        run: |
          set -euo pipefail

          STYLE_FILE="$APKTOOL_DIR/res/values/sl_styles.xml"

          if [ ! -f "$STYLE_FILE" ]; then
            echo "No sl_styles.xml; skipping."
            exit 0
          fi

          python3 - "$STYLE_FILE" <<'PY'
          import sys, re

          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          if 'name="SL.Chip"' not in content:
              print("SL.Chip not used in this project; nothing to fix.")
          else:
              updated, count = re.subn(
                  r'<style\s+name="SL\.Chip"\s*>',
                  '<style name="SL.Chip" parent="">',
                  content,
                  count=1,
              )
              if count:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(updated)
                  print("SL.Chip parent fixed.")
              else:
                  print("SL.Chip already has a parent.")
          PY

      - name: Fix Settings Layout Attribute
        shell: bash
        run: |
          set -euo pipefail

          FILE="$APKTOOL_DIR/res/layout/fragment_settings_page.xml"

          if [ -f "$FILE" ]; then
            python3 - "$FILE" <<'PY'
          import sys, re

          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          updated, count = re.subn(
              r'(\bboxBackgroundMode\s*=\s*["\'])outlined(["\'])',
              r'\1outline\2',
              content,
          )

          if count:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(updated)

          print(f"Adjusted {count} value(s).")
          PY
          else
            echo "Settings layout not found; skipping."
          fi

      - name: Verify resource IDs
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$APKTOOL_DIR/res/values/public.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          seen = set()

          for item in root.findall("public"):
              rid = item.get("id")
              if rid and rid in seen:
                  raise SystemExit("Duplicate resource ID: " + rid)
              if rid:
                  seen.add(rid)

          print("Resource IDs verified.")
          PY

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$APKTOOL_DIR/build" "$APKTOOL_DIR/dist"

          java -jar apktool.jar b --use-aapt2 --force \
            "$APKTOOL_DIR" -o SpeedLife-unsigned.apk 2>&1 | tee build.log

          test -s SpeedLife-unsigned.apk
          echo "APK build completed."

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail
          "$BUILD_TOOLS/zipalign" -f 4 SpeedLife-unsigned.apk SpeedLife-aligned.apk
          test -s SpeedLife-aligned.apk

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SPEEDLIFE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SPEEDLIFE_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.SPEEDLIFE_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.SPEEDLIFE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE_BASE64" ]; then

            if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS_SECRET" ]; then
              echo "ERROR: Signing secrets are incomplete."
              exit 1
            fi

            echo "$KEYSTORE_BASE64" | base64 --decode > speedlife.keystore

            ALIAS="$KEY_ALIAS_SECRET"
            STORE_PASS="$STORE_PASSWORD"
            KEY_PASS="${KEY_PASSWORD_SECRET:-$STORE_PASSWORD}"
            echo "Using configured signing key."

          else

            echo "No signing key configured. Creating temporary signing key."

            keytool -genkeypair \
              -keystore speedlife.keystore \
              -alias speedlife \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass temporary123 \
              -keypass temporary123 \
              -dname "CN=SpeedLife, OU=Launcher, O=SpeedLife, L=Unknown, ST=Unknown, C=US"

            ALIAS="speedlife"
            STORE_PASS="temporary123"
            KEY_PASS="temporary123"

          fi

          "$BUILD_TOOLS/apksigner" sign \
            --ks speedlife.keystore \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out SpeedLife.apk \
            SpeedLife-aligned.apk

          test -s SpeedLife.apk
          echo "APK signing completed."

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          "$BUILD_TOOLS/apksigner" verify SpeedLife.apk
          "$BUILD_TOOLS/zipalign" -c 4 SpeedLife.apk
          echo "APK verification successful."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedLife-APK
          path: SpeedLife.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" SpeedLife.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "SpeedLife APK uploaded to release $TAG."

      # If anything fails, the build log is saved so the exact error can be read quickly.
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
