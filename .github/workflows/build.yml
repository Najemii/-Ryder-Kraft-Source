
name: Build SpeedLife APK

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag containing source ZIP"
        required: true
        default: "v1.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Build Tools
        run: |
          yes | sdkmanager --licenses >/dev/null

          sdkmanager --install \
            "platform-tools" \
            "build-tools;35.0.0"

      - name: Download SpeedLife Source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -e

          echo "Downloading source from release: $TAG"

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "SpeedLife_Launcher_Settings_Redesign.zip" \
            --dir .

          test -s SpeedLife_Launcher_Settings_Redesign.zip

          unzip -t SpeedLife_Launcher_Settings_Redesign.zip

          mkdir -p source

          unzip -q SpeedLife_Launcher_Settings_Redesign.zip -d source

      - name: Check Source
        run: |
          set -e

          test -f source/apktool/apktool.yml
          test -f source/apktool/AndroidManifest.xml

          test -f source/apktool/smali/ro/alyn_sampmobile/launcher/DirectConnectSubmitListener.smali

          grep -Fq 'speedlife.launcher.game' source/apktool/AndroidManifest.xml

          grep -Fq '82.39.186.143' source/apktool/smali/ro/alyn_sampmobile/launcher/DirectConnectSubmitListener.smali

          grep -Fq '7013' source/apktool/smali/ro/alyn_sampmobile/launcher/DirectConnectSubmitListener.smali

          echo "Source validation successful."

      - name: Install Apktool
        run: |
          set -e

          curl -fL --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -o apktool.jar

          test -s apktool.jar

          java -jar apktool.jar --version

      - name: Build APK
        run: |
          set -e

          rm -rf source/apktool/build
          rm -rf source/apktool/dist

          echo "Trying AAPT2 build..."

          if java -jar apktool.jar b \
            --use-aapt2 \
            --force \
            --verbose \
            source/apktool \
            -o SpeedLife-unsigned.apk 2>&1 | tee build-aapt2.log; then

            echo "AAPT2 build successful."

          else

            echo "AAPT2 failed. Trying AAPT1..."

            rm -f SpeedLife-unsigned.apk
            rm -rf source/apktool/build
            rm -rf source/apktool/dist

            java -jar apktool.jar b \
              --use-aapt1 \
              --force \
              --verbose \
              source/apktool \
              -o SpeedLife-unsigned.apk 2>&1 | tee build-aapt1.log

          fi

          test -s SpeedLife-unsigned.apk

      - name: Align APK
        run: |
          set -e

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -p -f 4 \
            SpeedLife-unsigned.apk \
            SpeedLife-aligned.apk

          test -s SpeedLife-aligned.apk

      - name: Generate Signing Key
        run: |
          keytool -genkeypair \
            -keystore speedlife.keystore \
            -alias speedlife \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass temporary123 \
            -keypass temporary123 \
            -dname "CN=SpeedLife, OU=Android, O=SpeedLife, L=Tunis, S=Tunis, C=TN"

      - name: Sign APK
        run: |
          set -e

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks speedlife.keystore \
            --ks-key-alias speedlife \
            --ks-pass pass:temporary123 \
            --key-pass pass:temporary123 \
            --out SpeedLife.apk \
            SpeedLife-aligned.apk

          test -s SpeedLife.apk

      - name: Verify APK
        run: |
          set -e

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose SpeedLife.apk

          echo "APK verification successful."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedLife-APK
          path: SpeedLife.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            SpeedLife.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
