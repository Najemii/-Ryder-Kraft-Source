
name: Build SpeedLife APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build"
        required: true
        default: "speedlife-source-v1.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Build Tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "build-tools;35.0.0"

      - name: Download SpeedLife Source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "SpeedLife_Launcher_DirectConnect_Source_PACKAGE_FIXED.zip" \
            --dir .

          unzip -t SpeedLife_Launcher_DirectConnect_Source_PACKAGE_FIXED.zip
          unzip -q SpeedLife_Launcher_DirectConnect_Source_PACKAGE_FIXED.zip -d source

      - name: Check Source
        run: |
          test -f source/apktool/apktool.yml
          grep -q 'package="speedlife.launcher.game"' source/apktool/AndroidManifest.xml

      - name: Install Apktool
        run: |
          curl -fL \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -o apktool.jar

          test -s apktool.jar

      - name: Build APK
        run: |
          java -jar apktool.jar b source/apktool \
            -o SpeedLife-unsigned.apk

          test -s SpeedLife-unsigned.apk

      - name: Restore Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > speedlife.keystore
          test -s speedlife.keystore

      - name: Align APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -p -f 4 \
            SpeedLife-unsigned.apk \
            SpeedLife-aligned.apk

      - name: Sign APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks speedlife.keystore \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out SpeedLife.apk \
            SpeedLife-aligned.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose SpeedLife.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedLife-APK
          path: SpeedLife.apk
          if-no-files-found: error

      - name: Attach APK to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            SpeedLife.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
