
name: Build SpeedLife APK

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "vv3"
      source_asset:
        description: "Source ZIP filename"
        required: true
        default: "SpeedLife_PC_Input_Repaired_Source.zip"

permissions:
  contents: write

concurrency:
  group: build-speedlife-${{ github.event.release.tag_name || inputs.tag || 'vv3' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || 'vv3' }}
      SOURCE_ASSET: ${{ inputs.source_asset || 'SpeedLife_PC_Input_Repaired_Source.zip' }}

    steps:
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Build Tools
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "build-tools;35.0.0"

          BT="$ANDROID_HOME/build-tools/35.0.0"

          test -x "$BT/zipalign"
          test -x "$BT/apksigner"

          echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"

      - name: Cache Apktool
        id: apktool_cache
        uses: actions/cache@v4
        with:
          path: apktool.jar
          key: speedlife-apktool-2.10.0

      - name: Download Apktool
        if: steps.apktool_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -o apktool.jar

          test -s apktool.jar

      - name: Download Source ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Release: $TAG"
          echo "Source: $SOURCE_ASSET"

          RELEASE_JSON=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")

          ASSET_ID=$(echo "$RELEASE_JSON" | jq -r \
            --arg name "$SOURCE_ASSET" \
            '.assets[] | select(.name == $name) | .id' | head -n 1)

          if [ -z "$ASSET_ID" ]; then
            echo "ERROR: Source ZIP not found."
            echo "Available assets:"
            echo "$RELEASE_JSON" | jq -r '.assets[].name'
            exit 1
          fi

          curl -fL --retry 3 \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            -o source.zip

          test -s source.zip
          unzip -tq source.zip

          mkdir -p source
          unzip -q source.zip -d source

          echo "Source extracted successfully."

      - name: Locate Project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t FILES < <(
            find source -type f -name apktool.yml
          )

          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected one apktool.yml."
            echo "Found: ${#FILES[@]}"
            exit 1
          fi

          PROJECT_DIR="$(dirname "${FILES[0]}")"

          echo "APKTOOL_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/AndroidManifest.xml"
          test -f "$PROJECT_DIR/res/values/public.xml"

          grep -Fq 'speedlife.launcher.game' \
            "$PROJECT_DIR/AndroidManifest.xml"

          echo "Project directory: $PROJECT_DIR"

      # IMPORTANT:
      # apktool/original contains binary Android XML.
      # Do not parse these files using Python ElementTree.

      - name: Validate Decoded XML Resources
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$APKTOOL_DIR" <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          root = sys.argv[1]
          errors = []
          checked = 0

          for base, dirs, files in os.walk(root):

              # Skip original binary Android resources.
              dirs[:] = [
                  d for d in dirs
                  if d.lower() != "original"
                  and d.lower() != "build"
                  and d.lower() != "dist"
              ]

              for name in files:
                  if not name.lower().endswith(".xml"):
                      continue

                  path = os.path.join(base, name)

                  try:
                      ET.parse(path)
                      checked += 1
                  except Exception as e:
                      errors.append((path, str(e)))

          if errors:
              print("XML validation errors:")

              for path, error in errors:
                  print("\nFILE:", path)
                  print("ERROR:", error)

              sys.exit(1)

          print("Decoded XML validation successful.")
          print("Files checked:", checked)
          print("Original binary resources skipped.")
          PY

      - name: Fix Settings Layout
        shell: bash
        run: |
          set -euo pipefail

          FILE="$APKTOOL_DIR/res/layout/fragment_settings_page.xml"

          if [ -f "$FILE" ]; then
            python3 - "$FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, encoding="utf-8") as f:
              content = f.read()

          updated, count = re.subn(
              r'(\bboxBackgroundMode\s*=\s*["\'])outlined(["\'])',
              r'\1outline\2',
              content
          )

          if count:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(updated)

          print("Adjusted:", count)
          PY
          else
            echo "Settings layout not found. Skipping."
          fi

      - name: Verify Resource IDs
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$APKTOOL_DIR/res/values/public.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          seen = set()

          for item in root.findall("public"):
              rid = item.get("id")

              if rid and rid in seen:
                  raise SystemExit(
                      "Duplicate resource ID: " + rid
                  )

              if rid:
                  seen.add(rid)

          print("Resource IDs verified:", len(seen))
          PY

      - name: Build APK with AAPT2 and AAPT1 Fallback
        shell: bash
        run: |
          set -uo pipefail

          touch build.log

          rm -rf "$APKTOOL_DIR/build"
          rm -rf "$APKTOOL_DIR/dist"

          echo "================================"
          echo "BUILD ATTEMPT 1: AAPT2"
          echo "================================"

          if java -jar apktool.jar b \
            --use-aapt2 \
            --force \
            "$APKTOOL_DIR" \
            -o SpeedLife-unsigned.apk \
            2>&1 | tee -a build.log; then

            if [ -s SpeedLife-unsigned.apk ]; then
              echo "AAPT2 build successful."
              exit 0
            fi
          fi

          echo "AAPT2 failed. Trying AAPT1..."

          rm -f SpeedLife-unsigned.apk
          rm -rf "$APKTOOL_DIR/build"
          rm -rf "$APKTOOL_DIR/dist"

          echo "================================"
          echo "BUILD ATTEMPT 2: AAPT1"
          echo "================================"

          if java -jar apktool.jar b \
            --force \
            "$APKTOOL_DIR" \
            -o SpeedLife-unsigned.apk \
            2>&1 | tee -a build.log; then

            if [ -s SpeedLife-unsigned.apk ]; then
              echo "AAPT1 build successful."
              exit 0
            fi
          fi

          echo "ERROR: Both build methods failed."
          exit 1

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          test -s SpeedLife-unsigned.apk

          "$BUILD_TOOLS/zipalign" \
            -f 4 \
            SpeedLife-unsigned.apk \
            SpeedLife-aligned.apk

          test -s SpeedLife-aligned.apk

          echo "APK aligned successfully."

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SPEEDLIFE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SPEEDLIFE_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.SPEEDLIFE_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.SPEEDLIFE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE_BASE64" ]; then

            test -n "$STORE_PASSWORD"
            test -n "$KEY_ALIAS_SECRET"

            echo "$KEYSTORE_BASE64" | base64 --decode \
              > speedlife.keystore

            ALIAS="$KEY_ALIAS_SECRET"
            STORE_PASS="$STORE_PASSWORD"
            KEY_PASS="${KEY_PASSWORD_SECRET:-$STORE_PASSWORD}"

            echo "Using configured signing key."

          else

            echo "WARNING: Using temporary signing key."

            keytool -genkeypair \
              -keystore speedlife.keystore \
              -alias speedlife \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass temporary123 \
              -keypass temporary123 \
              -dname "CN=SpeedLife, OU=Launcher, O=SpeedLife, L=Unknown, ST=Unknown, C=US"

            ALIAS="speedlife"
            STORE_PASS="temporary123"
            KEY_PASS="temporary123"

          fi

          "$BUILD_TOOLS/apksigner" sign \
            --ks speedlife.keystore \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out SpeedLife.apk \
            SpeedLife-aligned.apk

          test -s SpeedLife.apk

          echo "APK signed successfully."

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          "$BUILD_TOOLS/apksigner" verify \
            --verbose SpeedLife.apk

          "$BUILD_TOOLS/zipalign" -c 4 SpeedLife.apk

          echo "APK verification successful."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedLife-APK
          path: SpeedLife.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "$TAG" \
            SpeedLife.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          echo "APK uploaded to release $TAG."

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpeedLife-Build-Logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
