name: Build SpeedLife APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "vv3"
        type: string
      source_asset:
        description: "Source ZIP filename"
        required: true
        default: "SpeedLife_PC_Input_Repaired_Source.zip"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || 'vv3' }}
      SOURCE_ASSET: ${{ inputs.source_asset || 'SpeedLife_PC_Input_Repaired_Source.zip' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Download Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar" \
            -o apktool.jar
          test -s apktool.jar

      - name: Download source ZIP from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"

          ASSET_ID="$(printf '%s' "$RELEASE_JSON" | jq -r \
            --arg asset "$SOURCE_ASSET" \
            '[.assets[] | select(.name == $asset)][0].id // empty')"

          if [ -z "$ASSET_ID" ]; then
            echo "::error::Source ZIP not found in release $TAG"
            printf '%s\n' "$RELEASE_JSON" | jq -r '.assets[].name'
            exit 1
          fi

          curl -fL \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            -o source.zip

          unzip -tq source.zip
          mkdir -p source
          unzip -q source.zip -d source

      - name: Locate Apktool project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t PROJECT_FILES < <(
            find source -type f -name apktool.yml -not -path '*/original/*'
          )

          if [ "${#PROJECT_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected one apktool.yml, found ${#PROJECT_FILES[@]}"
            printf '%s\n' "${PROJECT_FILES[@]}"
            exit 1
          fi

          PROJECT_DIR="$(dirname "${PROJECT_FILES[0]}")"

          test -f "$PROJECT_DIR/AndroidManifest.xml"

          echo "APKTOOL_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Repair known Smali compile error
        shell: bash
        run: |
          set -euo pipefail

          FILE="$APKTOOL_DIR/smali/com/wardrumstudios/utils/SlPadCapture.smali"
          test -f "$FILE"

          python3 - "$FILE" <<'PY'
          import pathlib, re, sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'(?m)^(\s*)\.locals\s+1\s*\n'
              r'(\s*)sget v0, Landroid/os/Build\$VERSION;->SDK_INT:I\s*\n'
              r'(\s*)if-lt v0, 0x17, :dispatch\s*$'
          )

          replacement = (
              r'\1.locals 2\n'
              r'\2sget v0, Landroid/os/Build$VERSION;->SDK_INT:I\n'
              r'\3const/16 v1, 0x17\n'
              r'\3if-lt v0, v1, :dispatch'
          )

          updated, count = pattern.subn(replacement, text, count=1)

          if count:
              path.write_text(updated, encoding="utf-8")
              print("Smali instruction repaired.")
          elif re.search(r'(?m)^\s*if-lt v0, v1, :dispatch\s*$', text):
              print("Smali instruction already repaired.")
          else:
              raise SystemExit("Unexpected Smali structure.")
          PY

      - name: Validate decoded XML resources
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$APKTOOL_DIR" <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET

          root = sys.argv[1]
          checked = 0
          errors = []

          for base, dirs, files in os.walk(root):
              dirs[:] = [
                  d for d in dirs
                  if d.lower() not in {"original", "build", "dist"}
              ]

              for name in files:
                  if name.lower().endswith(".xml"):
                      path = os.path.join(base, name)
                      try:
                          ET.parse(path)
                          checked += 1
                      except Exception as exc:
                          errors.append((path, str(exc)))

          if errors:
              for path, error in errors:
                  print(path, error)
              raise SystemExit(1)

          print(f"Validated {checked} XML files.")
          PY

      - name: Verify public resource IDs
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$APKTOOL_DIR/res/values/public.xml" <<'PY'
          import collections, sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          ids = [
              item.get("id")
              for item in root.findall("public")
              if item.get("id")
          ]

          duplicates = [
              value
              for value, count in collections.Counter(ids).items()
              if count > 1
          ]

          if duplicates:
              raise SystemExit("Duplicate IDs: " + ", ".join(duplicates))

          print("Public resource IDs verified.")
          PY

      - name: Build APK with AAPT2
        id: build_aapt2
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          java -jar apktool.jar b \
            --use-aapt2 \
            --force \
            "$APKTOOL_DIR" \
            -o SpeedLife-unsigned.apk

      - name: Build APK with AAPT1 fallback
        if: steps.build_aapt2.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail

          rm -f SpeedLife-unsigned.apk
          rm -rf "$APKTOOL_DIR/build" "$APKTOOL_DIR/dist"

          java -jar apktool.jar b \
            --force \
            "$APKTOOL_DIR" \
            -o SpeedLife-unsigned.apk

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            SpeedLife-unsigned.apk SpeedLife-aligned.apk

          "$BUILD_TOOLS/zipalign" -c 4 SpeedLife-aligned.apk

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.SPEEDLIFE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.SPEEDLIFE_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS || secrets.SPEEDLIFE_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.SPEEDLIFE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > speedlife.keystore

            KEY_PASS="${KEY_PASSWORD_SECRET:-$STORE_PASSWORD}"
            ALIAS="$KEY_ALIAS_SECRET"
          else
            echo "::warning::Using temporary signing key."

            keytool -genkeypair -noprompt \
              -keystore speedlife.keystore \
              -alias speedlife \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass temporary123 \
              -keypass temporary123 \
              -dname "CN=SpeedLife, O=SpeedLife, C=US"

            STORE_PASSWORD="temporary123"
            KEY_PASS="temporary123"
            ALIAS="speedlife"
          fi

          "$BUILD_TOOLS/apksigner" sign \
            --ks speedlife.keystore \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASS" \
            --out SpeedLife.apk \
            SpeedLife-aligned.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" verify --verbose SpeedLife.apk
          "$BUILD_TOOLS/zipalign" -c 4 SpeedLife.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedLife-APK
          path: SpeedLife.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "$TAG" SpeedLife.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
