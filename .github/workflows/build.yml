
name: Extract Ryder Kraft APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag
        required: true
        default: apk_v1

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool unzip zip jq

      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input extracted

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="$GITHUB_REF_NAME"
          fi

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.apk" \
            --dir input

          APK=$(find input -maxdepth 1 -type f -iname "*.apk" -print -quit)

          test -n "$APK" || {
            echo "APK file not found!"
            exit 1
          }

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Install JADX
        run: |
          URL=$(curl -fsSL \
            https://api.github.com/repos/skylot/jadx/releases/latest \
            | jq -r '.assets[] |
            select(.name | test("^jadx-[0-9].*\\.zip$")) |
            .browser_download_url' | head -n 1)

          test -n "$URL"

          curl -fL "$URL" -o jadx.zip
          mkdir jadx
          unzip -q jadx.zip -d jadx

          JADX=$(find jadx -type f -path "*/bin/jadx" -print -quit)

          test -n "$JADX"
          chmod +x "$JADX"

          echo "JADX=$JADX" >> "$GITHUB_ENV"

      - name: Decode APK
        run: |
          mkdir -p extracted/apktool
          apktool d -f "$APK" -o extracted/apktool

      - name: Decompile Java
        continue-on-error: true
        run: |
          mkdir -p extracted/jadx

          "$JADX" --show-bad-code \
            --no-imports \
            -d extracted/jadx "$APK" || {
              echo "JADX encountered errors."
              echo "Keeping extracted files."
              test -d extracted/jadx
            }

      - name: Copy original APK
        run: |
          mkdir -p extracted/original
          cp "$APK" extracted/original/

      - name: Create ZIP
        run: |
          zip -qr Ryder-Kraft-Source.zip extracted

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ryder-Kraft-Source
          path: Ryder-Kraft-Source.zip
          if-no-files-found: error
          retention-days: 30
