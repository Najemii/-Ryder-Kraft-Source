
name: SpeedLife APK Build

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub Release tag"
        required: true
        default: "vv3"

permissions:
  contents: write

jobs:
  build:
    name: Build SpeedLife APK
    runs-on: ubuntu-latest

    env:
      ASSET_NAME: SpeedLife_Launcher_Settings_CrashFix_Source.zip
      APKTOOL_VERSION: 2.10.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Select Release Tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          TAG="${RELEASE_TAG:-$INPUT_TAG}"

          if [ -z "$TAG" ]; then
            echo "ERROR: Release tag is empty."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"

      - name: Download modified source ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          echo "Downloading source from release: $TAG"

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --dir .

          test -s "$ASSET_NAME"
          unzip -t "$ASSET_NAME"

          mkdir -p source
          unzip -q "$ASSET_NAME" -d source

          echo "Source ZIP downloaded and extracted successfully."

      - name: Locate APK source
        id: source
        run: |
          set -euo pipefail

          mapfile -t FILES < <(
            find source -type f -name "apktool.yml"
          )

          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one apktool.yml."
            echo "Found: ${#FILES[@]}"
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi

          APK_DIR="$(dirname "${FILES[0]}")"

          echo "dir=$APK_DIR" >> "$GITHUB_OUTPUT"
          echo "APK source directory: $APK_DIR"

      - name: Verify source files
        env:
          APK_DIR: ${{ steps.source.outputs.dir }}
        run: |
          set -euo pipefail

          test -f "$APK_DIR/apktool.yml"
          test -f "$APK_DIR/AndroidManifest.xml"
          test -f "$APK_DIR/res/values/public.xml"

          echo "Required source files found."

      - name: Verify package name
        env:
          APK_DIR: ${{ steps.source.outputs.dir }}
        run: |
          set -euo pipefail

          if ! grep -Rqs 'speedlife.launcher.game' \
            "$APK_DIR/AndroidManifest.xml" "$APK_DIR/apktool.yml"; then
            echo "ERROR: Expected package name was not found."
            exit 1
          fi

          echo "Package verification passed."

      - name: Verify Direct Connect settings
        env:
          APK_DIR: ${{ steps.source.outputs.dir }}
        run: |
          set -euo pipefail

          mapfile -t LISTENERS < <(
            find "$APK_DIR" -type f \
              -name "DirectConnectSubmitListener.smali"
          )

          if [ "${#LISTENERS[@]}" -eq 0 ]; then
            echo "ERROR: DirectConnectSubmitListener.smali not found."
            exit 1
          fi

          if ! grep -Rqs '82\.39\.186\.143' "${LISTENERS[@]}"; then
            echo "ERROR: Server IP verification failed."
            exit 1
          fi

          if ! grep -Rqs '7013' "${LISTENERS[@]}"; then
            echo "ERROR: Server port verification failed."
            exit 1
          fi

          echo "Direct Connect verification passed."

      - name: Verify resource IDs
        env:
          APK_DIR: ${{ steps.source.outputs.dir }}
        run: |
          set -euo pipefail

          REQUIRED_IDS=(
            server_name
            server_address
            server_players
            server_gamemode
            server_language
            nickname_input
            nickname_input_text
            password_input
            password_input_text
            delete_button
            connect_button
          )

          for ID in "${REQUIRED_IDS[@]}"; do
            if ! grep -Rqs "name=\"$ID\"" "$APK_DIR/res"; then
              echo "ERROR: Missing resource ID: $ID"
              exit 1
            fi
          done

          echo "Resource ID verification passed."

      - name: Download Apktool
        run: |
          set -euo pipefail

          curl -fL \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" \
            -o apktool.jar

          test -s apktool.jar

      - name: Build APK
        env:
          APK_DIR: ${{ steps.source.outputs.dir }}
        run: |
          set -euo pipefail

          java -jar apktool.jar b "$APK_DIR" \
            -o speedlife-unsigned.apk

          test -s speedlife-unsigned.apk

          echo "APK build completed."

      - name: Align APK
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/zipalign" -f -v 4 \
            speedlife-unsigned.apk \
            speedlife-aligned.apk

          test -s speedlife-aligned.apk

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SPEEDLIFE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SPEEDLIFE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPEEDLIFE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPEEDLIFE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > speedlife.keystore

            test -s speedlife.keystore

            echo "Using configured signing keystore."
          else
            echo "No signing keystore configured."
            echo "Generating temporary signing key."

            keytool -genkeypair \
              -keystore speedlife.keystore \
              -alias speedlife \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass temporary123 \
              -keypass temporary123 \
              -dname "CN=SpeedLife, OU=Launcher, O=SpeedLife, L=Unknown, ST=Unknown, C=US"

            echo "KEYSTORE_PASSWORD=temporary123" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=temporary123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=speedlife" >> "$GITHUB_ENV"
          fi

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SPEEDLIFE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPEEDLIFE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPEEDLIFE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          STORE_PASS="${KEYSTORE_PASSWORD:-${KEYSTORE_PASSWORD:-temporary123}}"
          ALIAS="${KEY_ALIAS:-speedlife}"
          KEY_PASS="${KEY_PASSWORD:-${KEYSTORE_PASSWORD:-temporary123}}"

          if [ -z "$STORE_PASS" ]; then
            STORE_PASS="temporary123"
          fi

          if [ -z "$KEY_PASS" ]; then
            KEY_PASS="$STORE_PASS"
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" sign \
            --ks speedlife.keystore \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out SpeedLife.apk \
            speedlife-aligned.apk

          test -s SpeedLife.apk

      - name: Verify signed APK
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" verify --verbose SpeedLife.apk

          "$BUILD_TOOLS/zipalign" -c -v 4 SpeedLife.apk

          echo "Signed APK verification passed."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedLife-APK
          path: SpeedLife.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          gh release upload "$TAG" SpeedLife.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          echo "APK uploaded to release $TAG."
