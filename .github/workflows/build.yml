
name: Build SpeedLife APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Download source from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p source
          gh release download SpeedLife_v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "SpeedLife_modified_source.zip" \
            --dir source

          test -f source/SpeedLife_modified_source.zip

      - name: Extract source
        run: |
          unzip -q source/SpeedLife_modified_source.zip -d source
          test -f source/apktool/apktool.yml
          test -f source/apktool/AndroidManifest.xml

      - name: Download Apktool
        run: |
          curl -L --fail --retry 3 \
            -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar

      - name: Build APK
        run: |
          java -jar apktool.jar b source/apktool \
            -o SpeedLife-unsigned.apk

          test -s SpeedLife-unsigned.apk

      - name: Align APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/zipalign \
            -p -f 4 SpeedLife-unsigned.apk SpeedLife-aligned.apk

      - name: Create signing key
        run: |
          keytool -genkeypair -v \
            -keystore speedlife-temporary.jks \
            -storepass changeit \
            -keypass changeit \
            -alias speedlife \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=SpeedLife, OU=Build, O=SpeedLife, L=Unknown, ST=Unknown, C=US"

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks speedlife-temporary.jks \
            --ks-key-alias speedlife \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --out SpeedLife.apk SpeedLife-aligned.apk

      - name: Verify APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify \
            --verbose --print-certs SpeedLife.apk

          test -s SpeedLife.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeedLife-APK
          path: SpeedLife.apk
          if-no-files-found: error
