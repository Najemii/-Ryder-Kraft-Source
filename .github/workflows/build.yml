
name: Extract APK Source

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool unzip zip jq

      - name: Download APK from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Ryder Kraft SA-MP.apk" \
            --dir .

      - name: Install JADX
        run: |
          URL=$(curl -fsSL \
            https://api.github.com/repos/skylot/jadx/releases/latest \
            | jq -r '.assets[] |
              select(.name | test("^jadx-[0-9].*\\.zip$")) |
              .browser_download_url' | head -n 1)

          test -n "$URL"
          curl -fL "$URL" -o "$RUNNER_TEMP/jadx.zip"
          mkdir -p "$RUNNER_TEMP/jadx"
          unzip -q "$RUNNER_TEMP/jadx.zip" \
            -d "$RUNNER_TEMP/jadx"

          JADX=$(find "$RUNNER_TEMP/jadx" \
            -type f -path '*/bin/jadx' -print -quit)

          chmod +x "$JADX"
          echo "JADX=$JADX" >> "$GITHUB_ENV"

      - name: Prepare output
        run: |
          mkdir -p extracted/apktool
          mkdir -p extracted/jadx
          mkdir -p extracted/original

          cp "Ryder Kraft SA-MP.apk" \
            extracted/original/

      - name: Decode APK with APKTool
        run: |
          apktool d -f \
            "Ryder Kraft SA-MP.apk" \
            -o extracted/apktool

      - name: Extract Java source with JADX
        run: |
          "$JADX" \
            --show-bad-code \
            -d extracted/jadx \
            "Ryder Kraft SA-MP.apk"

      - name: Create source ZIP
        run: |
          cat > extracted/README.txt <<'EOF'
          Ryder Kraft APK Extraction

          apktool:
          Decoded Android resources, manifest and Smali code.

          jadx:
          Decompiled Java source code.

          original:
          Original APK file.

          Note:
          This is a decompiled project, not the original
          Android Studio project.
          Native libraries remain binary files.
          EOF

          zip -qr Ryder-Kraft-Source.zip extracted

      - name: Upload extracted project
        uses: actions/upload-artifact@v4
        with:
          name: Ryder-Kraft-Source
          path: Ryder-Kraft-Source.zip
          if-no-files-found: error
          retention-days: 30
