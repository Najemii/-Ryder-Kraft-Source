
name: Build SpeedLife APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag containing the SpeedLife source ZIP"
        required: true
        default: "speedlife-source-v1.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Build Tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "build-tools;35.0.0"

      - name: Check Android Tools
        run: |
          sdkmanager --version
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Download SpeedLife Source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          test -n "$TAG"

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "SpeedLife_Launcher_DirectConnect_Source_DIRECTCONNECT_FIXED.zip" \
            --dir .

          unzip -t SpeedLife_Launcher_DirectConnect_Source_DIRECTCONNECT_FIXED.zip
          mkdir -p source
          unzip -q SpeedLife_Launcher_DirectConnect_Source_DIRECTCONNECT_FIXED.zip -d source

      - name: Check Source
        run: |
          test -f source/apktool/apktool.yml
          test -f source/apktool/AndroidManifest.xml
          grep -q 'speedlife.launcher.game' source/apktool/AndroidManifest.xml

      - name: Install Apktool
        run: |
          curl -fL --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -o apktool.jar
          test -s apktool.jar

      - name: Build APK
        run: |
          java -jar apktool.jar b source/apktool \
            -o SpeedLife-unsigned.apk
          test -s SpeedLife-unsigned.apk

      - name: Align APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -p -f 4 \
            SpeedLife-unsigned.apk \
            SpeedLife-aligned.apk

      - name: Restore Signing Key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > speedlife-release.jks
          test -s speedlife-release.jks

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks speedlife-release.jks \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out SpeedLife.apk \
            SpeedLife-aligned.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs SpeedLife.apk
          test -s SpeedLife.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedLife-APK
          path: SpeedLife.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            SpeedLife.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
