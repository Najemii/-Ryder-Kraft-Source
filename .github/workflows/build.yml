
name: Build SpeedLife APK

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "vv3"
      source_asset:
        description: "Source ZIP filename"
        required: true
        default: "SpeedLife_PC_Input_Repaired_Source.zip"

permissions:
  contents: write

concurrency:
  group: build-speedlife-${{ github.event.release.tag_name || inputs.tag || 'vv3' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || 'vv3' }}
      SOURCE_ASSET: ${{ inputs.source_asset || 'SpeedLife_PC_Input_Repaired_Source.zip' }}

    steps:
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Build Tools
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install "build-tools;35.0.0"

          BT="$ANDROID_HOME/build-tools/35.0.0"

          test -x "$BT/zipalign"
          test -x "$BT/apksigner"

          echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"

      - name: Cache Apktool
        id: apktool_cache
        uses: actions/cache@v4
        with:
          path: apktool.jar
          key: apktool-2.10.0

      - name: Download Apktool
        if: steps.apktool_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -o apktool.jar

          test -s apktool.jar

      - name: Download SpeedLife Source From Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Release tag: $TAG"
          echo "Source asset: $SOURCE_ASSET"

          RELEASE_JSON=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")

          ASSET_ID=$(echo "$RELEASE_JSON" | jq -r \
            --arg name "$SOURCE_ASSET" \
            '.assets[] | select(.name == $name) | .id' | head -n 1)

          if [ -z "$ASSET_ID" ]; then
            echo "ERROR: Source ZIP not found in release $TAG"
            echo "Available release assets:"
            echo "$RELEASE_JSON" | jq -r '.assets[].name'
            exit 1
          fi

          echo "Downloading asset ID: $ASSET_ID"

          curl -fL --retry 3 \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            -o source.zip

          test -s source.zip

          unzip -tq source.zip

          mkdir -p source
          unzip -q source.zip -d source

          echo "Source ZIP extracted successfully."

      - name: Locate and Validate SpeedLife Project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t FILES < <(
            find source -type f -name apktool.yml
          )

          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one apktool.yml."
            echo "Found: ${#FILES[@]}"
            exit 1
          fi

          APKTOOL_DIR="$(dirname "${FILES[0]}")"

          echo "APKTOOL_DIR=$APKTOOL_DIR" >> "$GITHUB_ENV"

          test -f "$APKTOOL_DIR/AndroidManifest.xml"
          test -f "$APKTOOL_DIR/res/values/public.xml"

          grep -Fq 'speedlife.launcher.game' \
            "$APKTOOL_DIR/AndroidManifest.xml"

          LISTENER=$(find "$APKTOOL_DIR" \
            -name DirectConnectSubmitListener.smali \
            -print -quit)

          if [ -z "$LISTENER" ]; then
            echo "ERROR: DirectConnectSubmitListener.smali missing."
            exit 1
          fi

          grep -Fq '82.39.186.143' "$LISTENER"

          if ! grep -Eq '7013|0x1b65' "$LISTENER"; then
            echo "ERROR: Server port verification failed."
            exit 1
          fi

          echo "SpeedLife project validation successful."
          echo "Project directory: $APKTOOL_DIR"

      - name: Fix SL Chip Style
        shell: bash
        run: |
          set -euo pipefail

          STYLE_FILE="$APKTOOL_DIR/res/values/sl_styles.xml"

          if [ ! -f "$STYLE_FILE" ]; then
            echo "SL styles not found. Skipping."
            exit 0
          fi

          python3 - "$STYLE_FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, encoding="utf-8") as f:
              content = f.read()

          if 'name="SL.Chip"' not in content:
              print("SL.Chip not found.")
          else:
              updated, count = re.subn(
                  r'<style\s+name="SL\.Chip"\s*>',
                  '<style name="SL.Chip" parent="">',
                  content,
                  count=1
              )

              if count:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(updated)

                  print("SL.Chip adjusted.")
              else:
                  print("SL.Chip already adjusted.")
          PY

      - name: Fix Settings Layout
        shell: bash
        run: |
          set -euo pipefail

          FILE="$APKTOOL_DIR/res/layout/fragment_settings_page.xml"

          if [ ! -f "$FILE" ]; then
            echo "Settings layout not found. Skipping."
            exit 0
          fi

          python3 - "$FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, encoding="utf-8") as f:
              content = f.read()

          updated, count = re.subn(
              r'(\bboxBackgroundMode\s*=\s*["\'])outlined(["\'])',
              r'\1outline\2',
              content
          )

          if count:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(updated)

          print(f"Adjusted {count} setting(s).")
          PY

      - name: Verify Resource IDs
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$APKTOOL_DIR/res/values/public.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          seen = set()

          for item in root.findall("public"):
              rid = item.get("id")

              if rid and rid in seen:
                  raise SystemExit(
                      "Duplicate resource ID: " + rid
                  )

              if rid:
                  seen.add(rid)

          print("Resource IDs verified.")
          PY

      - name: Build SpeedLife APK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$APKTOOL_DIR/build"
          rm -rf "$APKTOOL_DIR/dist"

          java -jar apktool.jar b \
            --use-aapt2 \
            --force \
            "$APKTOOL_DIR" \
            -o SpeedLife-unsigned.apk \
            2>&1 | tee build.log

          test -s SpeedLife-unsigned.apk

          echo "APK build completed."

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          "$BUILD_TOOLS/zipalign" \
            -f 4 \
            SpeedLife-unsigned.apk \
            SpeedLife-aligned.apk

          test -s SpeedLife-aligned.apk

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SPEEDLIFE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SPEEDLIFE_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.SPEEDLIFE_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.SPEEDLIFE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE_BASE64" ]; then

            if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS_SECRET" ]; then
              echo "ERROR: Signing secrets are incomplete."
              exit 1
            fi

            echo "$KEYSTORE_BASE64" | base64 --decode > speedlife.keystore

            ALIAS="$KEY_ALIAS_SECRET"
            STORE_PASS="$STORE_PASSWORD"
            KEY_PASS="${KEY_PASSWORD_SECRET:-$STORE_PASSWORD}"

            echo "Using configured signing key."

          else

            echo "No signing key configured."
            echo "Creating temporary signing key."

            keytool -genkeypair \
              -keystore speedlife.keystore \
              -alias speedlife \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass temporary123 \
              -keypass temporary123 \
              -dname "CN=SpeedLife, OU=Launcher, O=SpeedLife, L=Unknown, ST=Unknown, C=US"

            ALIAS="speedlife"
            STORE_PASS="temporary123"
            KEY_PASS="temporary123"

          fi

          "$BUILD_TOOLS/apksigner" sign \
            --ks speedlife.keystore \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out SpeedLife.apk \
            SpeedLife-aligned.apk

          test -s SpeedLife.apk

          echo "APK signing completed."

      - name: Verify Signed APK
        shell: bash
        run: |
          set -euo pipefail

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            SpeedLife.apk

          "$BUILD_TOOLS/zipalign" -c 4 SpeedLife.apk

          echo "APK verification successful."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedLife-APK
          path: SpeedLife.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK To Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "$TAG" \
            SpeedLife.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          echo "SpeedLife.apk uploaded to release $TAG."

      - name: Upload Build Logs On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SpeedLife-Build-Logs
          path: |
            build.log
            source.zip
          if-no-files-found: ignore
          retention-days: 7
