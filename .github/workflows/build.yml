name: Build SpeedLife APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag containing the source ZIP"
        required: true
        default: "vv3"
        type: string
      source_asset:
        description: "Exact source ZIP asset filename"
        required: true
        default: "SpeedLife_PC_Input_Repaired_Source.zip"
        type: string

permissions:
  contents: write

concurrency:
  group: build-speedlife-${{ github.event.release.tag_name || inputs.tag || 'vv3' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || 'vv3' }}
      SOURCE_ASSET: ${{ inputs.source_asset || 'SpeedLife_PC_Input_Repaired_Source.zip' }}

    steps:
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "build-tools;35.0.0" "platforms;android-35"
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"

      - name: Cache Apktool
        id: apktool-cache
        uses: actions/cache@v4
        with:
          path: apktool.jar
          key: speedlife-apktool-2.10.0

      - name: Download Apktool
        if: steps.apktool-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar" \
            -o apktool.jar
          test -s apktool.jar

      - name: Download source ZIP from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Release tag: $TAG"
          echo "Source asset: $SOURCE_ASSET"

          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          ASSET_ID="$(printf '%s' "$RELEASE_JSON" | jq -r \
            --arg asset "$SOURCE_ASSET" \
            '[.assets[] | select(.name == $asset)][0].id // empty')"

          if [ -z "$ASSET_ID" ]; then
            echo "::error::Asset '$SOURCE_ASSET' was not found in release '$TAG'."
            printf '%s\n' "$RELEASE_JSON" | jq -r '.assets[].name'
            exit 1
          fi

          curl -fL --retry 4 --retry-delay 2 \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            -o source.zip

          test -s source.zip
          unzip -tq source.zip
          mkdir -p source
          unzip -q source.zip -d source
          echo "Source ZIP downloaded and extracted."

      - name: Locate Apktool project
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PROJECT_FILES < <(find source -type f -name apktool.yml -not -path '*/original/*')
          if [ "${#PROJECT_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one apktool.yml; found ${#PROJECT_FILES[@]}."
            printf '%s\n' "${PROJECT_FILES[@]}"
            exit 1
          fi

          PROJECT_DIR="$(dirname "${PROJECT_FILES[0]}")"
          test -f "$PROJECT_DIR/AndroidManifest.xml"
          test -f "$PROJECT_DIR/res/values/public.xml"
          grep -Fq 'speedlife.launcher.game' "$PROJECT_DIR/AndroidManifest.xml"

          echo "APKTOOL_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Repair known Smali compile error
        shell: bash
        run: |
          set -euo pipefail
          FILE="$APKTOOL_DIR/smali/com/wardrumstudios/utils/SlPadCapture.smali"
          test -f "$FILE"

          python3 - "$FILE" <<'PY'
          import pathlib, re, sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          # Dalvik if-lt requires two registers; it cannot compare a register
          # directly with the literal 0x17.
          broken = re.compile(
              r'(?m)^(\s*)\.locals\s+1\s*\n'
              r'(\s*)sget v0, Landroid/os/Build\$VERSION;->SDK_INT:I\s*\n'
              r'(\s*)if-lt v0, 0x17, :dispatch\s*$'
          )
          replacement = (
              r'\1.locals 2\n'
              r'\2sget v0, Landroid/os/Build$VERSION;->SDK_INT:I\n'
              r'\3const/16 v1, 0x17\n'
              r'\3if-lt v0, v1, :dispatch'
          )
          updated, count = broken.subn(replacement, text, count=1)

          if count:
              path.write_text(updated, encoding="utf-8")
              print("Repaired invalid if-lt immediate comparison.")
          elif re.search(
              r'(?m)^\s*if-lt v0, v1, :dispatch\s*$',
              text
          ):
              print("Smali comparison is already repaired.")
          else:
              raise SystemExit(
                  "Unexpected SlPadCapture.smali structure; refusing an unsafe patch."
              )
          PY

          if grep -nE '^[[:space:]]*if-(eq|ne|lt|ge|gt|le)[[:space:]]+v[0-9]+,[[:space:]]*(0x[0-9a-fA-F]+|-?[0-9]+),' "$FILE"; then
            echo "::error::Invalid literal operand remains in conditional branch."
            exit 1
          fi

      - name: Validate decoded XML resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$APKTOOL_DIR" <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET

          root = sys.argv[1]
          errors = []
          checked = 0

          for base, dirs, files in os.walk(root):
              dirs[:] = [
                  d for d in dirs
                  if d.lower() not in {"original", "build", "dist"}
              ]
              for name in files:
                  if not name.lower().endswith(".xml"):
                      continue
                  path = os.path.join(base, name)
                  try:
                      ET.parse(path)
                      checked += 1
                  except Exception as exc:
                      errors.append((path, str(exc)))

          if errors:
              for path, error in errors:
                  print(f"XML ERROR: {path}\n{error}")
              raise SystemExit(1)

          print(f"Decoded XML validation passed: {checked} files.")
          print("Binary files under apktool/original were excluded.")
          PY

      - name: Verify public resource IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$APKTOOL_DIR/res/values/public.xml" <<'PY'
          import collections, sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          ids = [
              item.get("id")
              for item in root.findall("public")
              if item.get("id")
          ]
          duplicates = [
              value for value, count in collections.Counter(ids).items()
              if count > 1
          ]
          if duplicates:
              raise SystemExit("Duplicate public resource IDs: " + ", ".join(duplicates))
          print(f"Public resource IDs verified: {len(ids)}")
          PY

      - name: Build APK (AAPT2, then AAPT1 fallback)
        shell: bash
        run: |
          set -uo pipefail
          rm -rf "$APKTOOL_DIR/build" "$APKTOOL_DIR/dist"
          rm -f SpeedLife-unsigned.apk build.log
          touch build.log

          echo "===== Apktool build using AAPT2 ====="
          set +e
          java -jar apktool.jar b --use-aapt2 --force \
            "$APKTOOL_DIR" -o SpeedLife-unsigned.apk 2>&1 | tee -a build.log
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -eq 0 ] && [ -s SpeedLife-unsigned.apk ]; then
            echo "AAPT2 build succeeded."
          else
            echo "AAPT2 build failed (exit $STATUS); trying AAPT1."
            rm -f SpeedLife-unsigned.apk
            rm -rf "$APKTOOL_DIR/build" "$APKTOOL_DIR/dist"

            set +e
            java -jar apktool.jar b --force \
              "$APKTOOL_DIR" -o SpeedLife-unsigned.apk 2>&1 | tee -a build.log
            STATUS=${PIPESTATUS[0]}
            set -e

            if [ "$STATUS" -ne 0 ] || [ ! -s SpeedLife-unsigned.apk ]; then
              echo "::error::Both Apktool build attempts failed. See build.log artifact."
              exit 1
            fi
            echo "AAPT1 build succeeded."
          fi

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail
          test -s SpeedLife-unsigned.apk
          "$BUILD_TOOLS/zipalign" -f -p 4 \
            SpeedLife-unsigned.apk SpeedLife-aligned.apk
          "$BUILD_TOOLS/zipalign" -c 4 SpeedLife-aligned.apk

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.SPEEDLIFE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.SPEEDLIFE_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS || secrets.SPEEDLIFE_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.SPEEDLIFE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            test -n "${STORE_PASSWORD:-}"
            test -n "${KEY_ALIAS_SECRET:-}"
            echo "$KEYSTORE_BASE64" | base64 --decode > speedlife-release.keystore
            test -s speedlife-release.keystore

            KEY_PASS="${KEY_PASSWORD_SECRET:-$STORE_PASSWORD}"
            echo "Using configured stable signing key."
          else
            echo "::warning::No signing-key secrets found. A temporary key will be used; this APK cannot update an installation signed with a different key."
            keytool -genkeypair -noprompt \
              -keystore speedlife-release.keystore \
              -alias speedlife \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass temporary123 -keypass temporary123 \
              -dname "CN=SpeedLife, OU=Launcher, O=SpeedLife, L=Unknown, ST=Unknown, C=US"
            KEY_ALIAS_SECRET="speedlife"
            STORE_PASSWORD="temporary123"
            KEY_PASS="temporary123"
          fi

          "$BUILD_TOOLS/apksigner" sign \
            --ks speedlife-release.keystore \
            --ks-key-alias "$KEY_ALIAS_SECRET" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASS" \
            --out SpeedLife.apk \
            SpeedLife-aligned.apk

          test -s SpeedLife.apk

      - name: Verify APK signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs SpeedLife.apk
          "$BUILD_TOOLS/zipalign" -c 4 SpeedLife.apk
          echo "APK signature and alignment verified."

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedLife-APK
          path: SpeedLife.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to the same GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" SpeedLife.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "SpeedLife.apk uploaded to release: $TAG"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpeedLife-Build-Logs
          path: |
            build.log
            SpeedLife-unsigned.apk
          if-no-files-found: ignore
          retention-days: 7
