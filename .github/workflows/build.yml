
name: Build SpeedLife APK

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag containing the modified source ZIP"
        required: true
        default: "vv3"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Build Tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "build-tools;35.0.0"

      - name: Download modified source ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          ASSET_NAME: SpeedLife_Launcher_Settings_CrashFix_Source.zip
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching release: $TAG"

          RELEASE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")

          ASSET_ID=$(echo "$RELEASE_JSON" | jq -r \
            --arg NAME "$ASSET_NAME" \
            '[.assets[] | select(.name == $NAME)][0].id // empty')

          if [ -z "$ASSET_ID" ]; then
            echo "Source ZIP not found in release $TAG"
            echo "Available assets:"
            echo "$RELEASE_JSON" | jq -r '.assets[].name'
            exit 1
          fi

          curl -fL --retry 3 \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            -o "$ASSET_NAME"

          test -s "$ASSET_NAME"
          unzip -t "$ASSET_NAME"

          mkdir -p source
          unzip -q "$ASSET_NAME" -d source

          echo "Source ZIP downloaded successfully."

      - name: Locate and validate project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t FILES < <(find source -type f -name apktool.yml)

          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one apktool.yml; found ${#FILES[@]}"
            exit 1
          fi

          APKTOOL_DIR="$(dirname "${FILES[0]}")"
          echo "APKTOOL_DIR=$APKTOOL_DIR" >> "$GITHUB_ENV"

          test -f "$APKTOOL_DIR/AndroidManifest.xml"
          test -f "$APKTOOL_DIR/res/values/public.xml"

          grep -Fq 'speedlife.launcher.game' \
            "$APKTOOL_DIR/AndroidManifest.xml"

          LISTENER=$(find "$APKTOOL_DIR" \
            -name DirectConnectSubmitListener.smali -print -quit)

          test -n "$LISTENER"
          grep -Fq '82.39.186.143' "$LISTENER"

          if ! grep -Eq '7013|0x1b65' "$LISTENER"; then
            echo "ERROR: Server port verification failed."
            exit 1
          fi

          echo "Project validation successful."

      # FIX: Android was looking for missing style/SL
      - name: Fix SL Chip Style
        shell: bash
        run: |
          set -euo pipefail

          STYLE_FILE="$APKTOOL_DIR/res/values/sl_styles.xml"

          test -f "$STYLE_FILE"

          python3 - "$STYLE_FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          pattern = r'<style\s+name="SL\.Chip"\s*>'

          updated, count = re.subn(
              pattern,
              '<style name="SL.Chip" parent="">',
              content,
              count=1
          )

          if count != 1:
              if '<style name="SL.Chip" parent="">' in content:
                  print("SL.Chip already fixed.")
              else:
                  raise SystemExit("ERROR: SL.Chip definition not found.")
          else:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(updated)

              print("SL.Chip parent fixed successfully.")
          PY

          grep -Fq '<style name="SL.Chip" parent="">' "$STYLE_FILE"

          echo "SL Chip verification successful."

      - name: Fix Settings Layout Attribute
        shell: bash
        run: |
          set -euo pipefail

          FILE="$APKTOOL_DIR/res/layout/fragment_settings_page.xml"

          if [ -f "$FILE" ]; then
            python3 - "$FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          updated, count = re.subn(
              r'(\bboxBackgroundMode\s*=\s*["\'])outlined(["\'])',
              r'\1outline\2',
              content
          )

          if count:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(updated)

          print(f"Adjusted {count} value(s).")
          PY
          else
            echo "Settings layout not found; skipping."
          fi

      - name: Verify resource IDs
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$APKTOOL_DIR/res/values/public.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          seen = set()

          for item in root.findall("public"):
              rid = item.get("id")

              if rid and rid in seen:
                  raise SystemExit("Duplicate resource ID: " + rid)

              if rid:
                  seen.add(rid)

          print("Resource IDs verified.")
          PY

      - name: Install Apktool
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -o apktool.jar

          test -s apktool.jar
          java -jar apktool.jar --version

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$APKTOOL_DIR/build" "$APKTOOL_DIR/dist"

          java -jar apktool.jar b --use-aapt2 --force --verbose \
            "$APKTOOL_DIR" -o SpeedLife-unsigned.apk 2>&1 | tee build.log

          test -s SpeedLife-unsigned.apk

          echo "APK build completed."

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/zipalign" -f -v 4 \
            SpeedLife-unsigned.apk \
            SpeedLife-aligned.apk

          test -s SpeedLife-aligned.apk

          echo "APK alignment completed."

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SPEEDLIFE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SPEEDLIFE_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.SPEEDLIFE_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.SPEEDLIFE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE_BASE64" ]; then

            if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS_SECRET" ]; then
              echo "ERROR: Signing secrets are incomplete."
              exit 1
            fi

            echo "$KEYSTORE_BASE64" | base64 --decode > speedlife.keystore

            ALIAS="$KEY_ALIAS_SECRET"
            STORE_PASS="$STORE_PASSWORD"
            KEY_PASS="${KEY_PASSWORD_SECRET:-$STORE_PASSWORD}"

            echo "Using configured signing key."

          else

            echo "No signing key configured."
            echo "Creating temporary signing key."

            keytool -genkeypair \
              -keystore speedlife.keystore \
              -alias speedlife \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass temporary123 \
              -keypass temporary123 \
              -dname "CN=SpeedLife, OU=Launcher, O=SpeedLife, L=Unknown, ST=Unknown, C=US"

            ALIAS="speedlife"
            STORE_PASS="temporary123"
            KEY_PASS="temporary123"

          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks speedlife.keystore \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out SpeedLife.apk \
            SpeedLife-aligned.apk

          test -s SpeedLife.apk

          echo "APK signing completed."

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" verify --verbose SpeedLife.apk

          "$BUILD_TOOLS/zipalign" -c -v 4 SpeedLife.apk

          echo "APK verification successful."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedLife-APK
          path: SpeedLife.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "$TAG" \
            SpeedLife.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          echo "SpeedLife APK uploaded to release $TAG."
