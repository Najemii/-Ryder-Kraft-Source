
name: Build SpeedLife APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "speedlife-source-v1.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Build Tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "build-tools;35.0.0"

      - name: Download SpeedLife Source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "SpeedLife_Launcher_DirectConnect_Source_DIRECTCONNECT_FIXED.zip" \
            --dir .

          unzip -t SpeedLife_Launcher_DirectConnect_Source_DIRECTCONNECT_FIXED.zip

          mkdir -p source

          unzip -q SpeedLife_Launcher_DirectConnect_Source_DIRECTCONNECT_FIXED.zip -d source

      - name: Check Source
        run: |
          test -f source/apktool/apktool.yml
          test -f source/apktool/AndroidManifest.xml

          test -f source/apktool/smali/ro/alyn_sampmobile/launcher/DirectConnectSubmitListener.smali

          grep -q 'speedlife.launcher.game' source/apktool/AndroidManifest.xml

          grep -q '82.39.186.143' source/apktool/smali/ro/alyn_sampmobile/launcher/DirectConnectSubmitListener.smali

          grep -q '7013' source/apktool/smali/ro/alyn_sampmobile/launcher/DirectConnectSubmitListener.smali

      - name: Install Apktool
        run: |
          curl -fL --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -o apktool.jar

          test -s apktool.jar

      - name: Build APK
        run: |
          java -jar apktool.jar b source/apktool \
            -o SpeedLife-unsigned.apk

          test -s SpeedLife-unsigned.apk

      - name: Align APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -p -f 4 \
            SpeedLife-unsigned.apk \
            SpeedLife-aligned.apk

      - name: Generate Temporary Signing Key
        run: |
          keytool -genkeypair \
            -keystore speedlife.keystore \
            -alias speedlife \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass temporary123 \
            -keypass temporary123 \
            -dname "CN=SpeedLife, OU=Android, O=SpeedLife, L=Tunis, S=Tunis, C=TN"

      - name: Sign APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks speedlife.keystore \
            --ks-key-alias speedlife \
            --ks-pass pass:temporary123 \
            --key-pass pass:temporary123 \
            --out SpeedLife.apk \
            SpeedLife-aligned.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose SpeedLife.apk

          test -s SpeedLife.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedLife-APK
          path: SpeedLife.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            SpeedLife.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
