
name: SpeedLife APK Build

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub Release tag"
        required: true
        default: "vv3"

permissions:
  contents: write

jobs:
  build:
    name: Build SpeedLife APK
    runs-on: ubuntu-latest

    env:
      ASSET_NAME: SpeedLife_Launcher_Settings_CrashFix_Source.zip
      APKTOOL_VERSION: "2.10.0"

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Java
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install SDK packages and accept licenses
      - name: Install Android Build Tools
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android SDK..."

          command -v sdkmanager

          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK is ready."

      # 5. Select release tag
      - name: Select Release Tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          TAG="${RELEASE_TAG:-${INPUT_TAG:-vv3}}"

          if [ -z "$TAG" ]; then
            echo "ERROR: Release tag is empty."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Selected tag: $TAG"

      # 6. Download source ZIP from GitHub Release
      - name: Download modified source ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading source ZIP..."
          echo "Release: $TAG"
          echo "Asset: $ASSET_NAME"

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --dir .

          if [ ! -s "$ASSET_NAME" ]; then
            echo "ERROR: Source ZIP was not downloaded."
            exit 1
          fi

          unzip -t "$ASSET_NAME"

          mkdir -p source

          unzip -q "$ASSET_NAME" -d source

          echo "Source downloaded successfully."

      # 7. Locate APK source
      - name: Locate APK source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t FILES < <(
            find source -type f -name "apktool.yml"
          )

          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one apktool.yml."
            echo "Found: ${#FILES[@]}"

            find source -maxdepth 5 -type f | head -100

            exit 1
          fi

          APK_DIR="$(dirname "${FILES[0]}")"

          echo "dir=$APK_DIR" >> "$GITHUB_OUTPUT"

          echo "APK source: $APK_DIR"

      # 8. Verify required files
      - name: Verify source files
        env:
          APK_DIR: ${{ steps.source.outputs.dir }}
        run: |
          set -euo pipefail

          test -f "$APK_DIR/apktool.yml"
          test -f "$APK_DIR/AndroidManifest.xml"
          test -f "$APK_DIR/res/values/public.xml"

          echo "Required files verified."

      # 9. Verify package
      - name: Verify package name
        env:
          APK_DIR: ${{ steps.source.outputs.dir }}
        run: |
          set -euo pipefail

          if ! grep -q 'package="speedlife.launcher.game"' \
            "$APK_DIR/AndroidManifest.xml"; then

            echo "ERROR: Package name is incorrect."
            exit 1
          fi

          echo "Package name verified."

      # 10. Verify Direct Connect
      - name: Verify Direct Connect settings
        env:
          APK_DIR: ${{ steps.source.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t LISTENERS < <(
            find "$APK_DIR" -type f \
              -name "DirectConnectSubmitListener.smali"
          )

          if [ "${#LISTENERS[@]}" -eq 0 ]; then
            echo "ERROR: DirectConnectSubmitListener.smali not found."
            exit 1
          fi

          if ! grep -q '82\.39\.186\.143' "${LISTENERS[@]}"; then
            echo "ERROR: Server IP not found."
            exit 1
          fi

          if ! grep -Eq '7013|0x1b65' "${LISTENERS[@]}"; then
            echo "ERROR: Server port not found."
            exit 1
          fi

          echo "Direct Connect verified."

      # 11. Verify resource IDs
      - name: Verify resource IDs
        env:
          APK_DIR: ${{ steps.source.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_IDS=(
            server_name
            server_address
            server_players
            server_gamemode
            server_language
            nickname_input
            nickname_input_text
            password_input
            password_input_text
            delete_button
            connect_button
          )

          for ID in "${REQUIRED_IDS[@]}"; do
            if ! grep -Rqs "name=\"$ID\"" "$APK_DIR/res"; then
              echo "ERROR: Missing resource ID: $ID"
              exit 1
            fi
          done

          echo "Resource IDs verified."

      # 12. Download Apktool
      - name: Download Apktool
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" \
            -o apktool.jar

          test -s apktool.jar

          java -jar apktool.jar --version

      # 13. Build APK
      - name: Build APK
        env:
          APK_DIR: ${{ steps.source.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          java -jar apktool.jar b "$APK_DIR" \
            -o speedlife-unsigned.apk

          test -s speedlife-unsigned.apk

          echo "APK built successfully."

      # 14. Zipalign
      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/zipalign" -f -v 4 \
            speedlife-unsigned.apk \
            speedlife-aligned.apk

          test -s speedlife-aligned.apk

          echo "APK aligned successfully."

      # 15. Sign APK
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SPEEDLIFE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SPEEDLIFE_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.SPEEDLIFE_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.SPEEDLIFE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE_BASE64" ]; then

            if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS_SECRET" ]; then
              echo "ERROR: Keystore secrets are incomplete."
              exit 1
            fi

            echo "$KEYSTORE_BASE64" | base64 --decode > speedlife.keystore

            ALIAS="$KEY_ALIAS_SECRET"
            STORE_PASS="$STORE_PASSWORD"
            KEY_PASS="${KEY_PASSWORD_SECRET:-$STORE_PASSWORD}"

            echo "Using configured keystore."

          else

            echo "No keystore configured."
            echo "Generating temporary signing key."

            keytool -genkeypair \
              -keystore speedlife.keystore \
              -alias speedlife \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass temporary123 \
              -keypass temporary123 \
              -dname "CN=SpeedLife, OU=Launcher, O=SpeedLife, L=Unknown, ST=Unknown, C=US"

            ALIAS="speedlife"
            STORE_PASS="temporary123"
            KEY_PASS="temporary123"

          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks speedlife.keystore \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out SpeedLife.apk \
            speedlife-aligned.apk

          test -s SpeedLife.apk

          echo "APK signed successfully."

      # 16. Verify APK
      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" verify --verbose SpeedLife.apk

          "$BUILD_TOOLS/zipalign" -c -v 4 SpeedLife.apk

          echo "Final APK verification passed."

      # 17. Upload artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedLife-APK
          path: SpeedLife.apk
          if-no-files-found: error
          retention-days: 30

      # 18. Upload APK to Release
      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "$TAG" SpeedLife.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          echo "SpeedLife APK uploaded successfully."
