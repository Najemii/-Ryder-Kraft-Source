
name: Extract Ryder Kraft APK

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool unzip zip curl jq

      - name: Find APK in Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: Ryder.Kraft.SA-MP.apk
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > releases.json

          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            ASSET_ID=$(jq -r \
              --arg tag "$GITHUB_REF_NAME" \
              --arg name "$APK_NAME" \
              '.[] | select(.tag_name == $tag) |
              .assets[] | select(.name == $name) | .id' \
              releases.json | head -n 1)
          else
            ASSET_ID=$(jq -r \
              --arg name "$APK_NAME" \
              '.[] | select(.draft == true) |
              .assets[] | select(.name == $name) | .id' \
              releases.json | head -n 1)
          fi

          if [ -z "$ASSET_ID" ]; then
            echo "ERROR: APK asset not found."
            echo "Available releases and assets:"
            jq -r '.[] |
              "Release: \(.tag_name), Draft: \(.draft)",
              (.assets[]?.name)' releases.json
            exit 1
          fi

          echo "ASSET_ID=$ASSET_ID" >> "$GITHUB_ENV"

      - name: Download Draft APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            -o Ryder.Kraft.SA-MP.apk

          test -s Ryder.Kraft.SA-MP.apk
          file Ryder.Kraft.SA-MP.apk

      - name: Install JADX
        run: |
          URL=$(curl -fsSL \
            https://api.github.com/repos/skylot/jadx/releases/latest \
            | jq -r '.assets[] |
            select(.name | test("^jadx-[0-9].*\\.zip$")) |
            .browser_download_url' | head -n 1)

          test -n "$URL"
          curl -fL "$URL" -o jadx.zip
          unzip -q jadx.zip -d jadx-tool

          JADX=$(find jadx-tool -type f \
            -path '*/bin/jadx' -print -quit)

          test -n "$JADX"
          chmod +x "$JADX"
          echo "JADX=$JADX" >> "$GITHUB_ENV"

      - name: Prepare folders
        run: |
          mkdir -p output/apktool
          mkdir -p output/jadx
          mkdir -p output/original

      - name: Extract with APKTool
        run: |
          apktool d -f Ryder.Kraft.SA-MP.apk \
            -o output/apktool

      - name: Extract Java with JADX
        run: |
          "$JADX" \
            --show-bad-code \
            -d output/jadx \
            Ryder.Kraft.SA-MP.apk

      - name: Save original APK
        run: |
          cp Ryder.Kraft.SA-MP.apk output/original/

      - name: Create README
        run: |
          cat > output/README.txt <<'EOF'
          Ryder Kraft APK Extraction

          apktool:
          Decoded resources, XML, manifest and Smali.

          jadx:
          Decompiled Java source.

          original:
          Original APK.

          Native libraries remain binary files.
          This is not the original Android Studio project.
          EOF

      - name: Create ZIP
        run: |
          zip -qr Ryder-Kraft-Source.zip output

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Ryder-Kraft-Source
          path: Ryder-Kraft-Source.zip
          if-no-files-found: error
          retention-days: 30
